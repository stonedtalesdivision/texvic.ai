services:
  texvic-ai:
    build: .
    container_name: texvic-ai-agent
    restart: always
    init: true
    shm_size: "2gb"
    ports:
      - "3100:3100"
    env_file:
      - .env
    volumes:
      # Persist SQLite database, Instagram authenticated cookies, and browser profile across restarts
      - ./data:/app/data
    environment:
      - PATH=/home/node/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - PORT=3100
      - HOST=0.0.0.0
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=1536
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3100/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
