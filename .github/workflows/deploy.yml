name: Continuous Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy updates to Oracle VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'ubuntu' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Connecting to Texvic AI repository..."
            if [ -d "$HOME/texvic.ai" ]; then
              cd "$HOME/texvic.ai"
            elif [ -d "$HOME/texvic.ai/texvic.ai" ]; then
              cd "$HOME/texvic.ai/texvic.ai"
            else
              echo "Repository directory not found!" && exit 1
            fi
            echo "📥 Pulling latest commits from GitHub..."
            git pull origin main
            echo "🔨 Rebuilding & launching updated container..."
            sudo docker compose up -d --build
            echo "🧹 Cleaning unused Docker cache..."
            sudo docker system prune -f
            echo "✅ Deployment completed successfully!"
