name: Continuous Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    # Only runs when VPS_HOST secret is defined in GitHub repository secrets
    if: "${{ secrets.VPS_HOST != '' }}"

    steps:
      - name: Deploy updates to Oracle VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'ubuntu' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Connecting to Texvic AI repository..."
            cd ~/texvic.ai/texvic.ai
            echo "📥 Pulling latest commits from GitHub..."
            git pull origin main
            echo "🔨 Rebuilding & launching updated container..."
            docker compose up -d --build
            echo "🧹 Cleaning unused Docker cache..."
            docker image prune -f
            echo "✅ Deployment completed successfully!"
